name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código
        uses: actions/checkout@v4 # 👈 Actualizado a v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4 # 👈 Actualizado a v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar el APK
        run: flutter build apk --release

      - name: Subir el APK para descargar
        uses: actions/upload-artifact@v4 # 🔥 EL FIX CLAVE: Actualizado a v4
        with:
          name: GestorLDS-v2.0-beta
          path: build/app/outputs/flutter-apk/app-release.apk