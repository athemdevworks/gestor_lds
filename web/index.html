<!DOCTYPE html><html><head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Proyecto de gestion de reuniones y agendas">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="gestor_lds">

    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="icon" type="image/png" href="logo_lds.png" id="dynamic-favicon">

    <title>gestor_lds</title>
    <link rel="manifest" href="manifest.json">

    <script>
        function updateFavicon() {
            const favicon = document.getElementById('dynamic-favicon');
            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDarkMode) {
                favicon.href = 'logo_lds_white.png';
            } else {
                favicon.href = 'logo_lds.png';
            }
        }
        updateFavicon();
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
    </script>

    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

    <style id="splash-screen-style">
        html { height: 100% }
        body { margin: 0; min-height: 100%; background-color: #FFFFFF; background-size: 100% 100%; }
        .center { margin: 0; position: absolute; top: 50%; left: 50%; -ms-transform: translate(-50%, -50%); transform: translate(-50%, -50%); }
        .contain { display:block; width:100%; height:100%; object-fit: contain; }
        .stretch { display:block; width:100%; height:100%; }
        .cover { display:block; width:100%; height:100%; object-fit: cover; }
        .bottom { position: absolute; bottom: 0; left: 50%; -ms-transform: translate(-50%, 0); transform: translate(-50%, 0); }
        .bottomLeft { position: absolute; bottom: 0; left: 0; }
        .bottomRight { position: absolute; bottom: 0; right: 0; }
        #splash {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 9999;
            background-color: #FFFFFF; /* Fondo blanco para que tape la app mientras carga */
            transition: opacity 0.4s ease-out; /* La magia: tarda medio segundo en cambiar opacidad */
            opacity: 1;
        }
    </style>

    <script id="splash-screen-script">
        function removeSplashFromWeb() {
            const splash = document.getElementById("splash");

            if (splash) {
                // 1. Iniciar la transición de opacidad a transparente (0)
                splash.style.opacity = "0";

                // 2. Esperar 500ms (lo que dura la animación CSS) antes de destruir el elemento
                setTimeout(function() {
                    splash.remove();
                    document.getElementById("splash-branding")?.remove();
                    document.body.style.background = "transparent";
                }, 500);
            }
        }
    </script>
</head>
<body>
<picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
</picture>

<script src="flutter_bootstrap.js?v=1.7.0" async=""></script>

<script>
    window.addEventListener('load', function(ev) {
        _flutter.loader.load({
            onEntrypointLoaded: async function(engineInitializer) {
                const appRunner = await engineInitializer.initializeEngine({
                    renderer: "html"
                });

                // Arranca la App
                await appRunner.runApp();

                // --- SOLUCIÓN ---
                // Una vez que la app arrancó, llamamos manualmente a la función de quitar el splash
                // Esto ejecutará tu animación de "Disolver" definida arriba.
                removeSplashFromWeb();
            }
        });
    });
</script>

</body></html>
