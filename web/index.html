<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Proyecto de gestion de reuniones y agendas">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="gestor_lds">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <link rel="icon" type="image/png" href="logo_lds.png" id="dynamic-favicon"/>

    <title>gestor_lds</title>
    <link rel="manifest" href="manifest.json">

    <script>
        function updateFavicon() {
            const favicon = document.getElementById('dynamic-favicon');
            // Detecta si el usuario prefiere modo oscuro
            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (isDarkMode) {
                // MODO OSCURO: Usamos el logo blanco
                favicon.href = 'logo_lds_white.png';
            } else {
                // MODO CLARO: Usamos el logo original (azul)
                favicon.href = 'logo_lds.png';
            }
        }

        // Ejecutar al iniciar
        updateFavicon();

        // Escuchar cambios en vivo (por si el usuario cambia el tema del sistema)
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
    </script>

</head>
<body>
<div id="loading_indicator" style="position: fixed; width: 100%; height: 100%; background: #164772; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div class="loader"></div>
</div>

<style>
    .loader {
        border: 8px solid #f3f3f3;
        border-top: 8px solid #F57C00; /* Naranja corporativo */
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    // Este script borra el loading cuando Flutter termina de cargar
    window.addEventListener('load', function(ev) {
        // Damos un pequeño delay para asegurar que Flutter pintó
        setTimeout(function() {
            var loading = document.getElementById('loading_indicator');
            if (loading) {
                loading.style.display = 'none';
            }
        }, 500); // medio segundo extra por seguridad
    });
</script>
<script src="flutter_bootstrap.js" async></script>
<script>
    // Esperamos a que la ventana cargue
    window.addEventListener('load', function(ev) {
        // Interceptamos el cargador de Flutter
        _flutter.loader.load({
            onEntrypointLoaded: async function(engineInitializer) {
                // Inicializamos el motor forzando HTML
                const appRunner = await engineInitializer.initializeEngine({
                    renderer: "html"
                });
                // Corremos la app
                await appRunner.runApp();
            }
        });
    });
</script>
</body>
</html>
