<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Proyecto de gestion de reuniones y agendas">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="gestor_lds">

    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/png" href="logo_lds.png" id="dynamic-favicon"/>

    <title>gestor_lds</title>
    <link rel="manifest" href="manifest.json">

    <script>
        function updateFavicon() {
            const favicon = document.getElementById('dynamic-favicon');
            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDarkMode) {
                favicon.href = 'logo_lds_white.png';
            } else {
                favicon.href = 'logo_lds.png';
            }
        }
        updateFavicon();
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
    </script>

</head>
<body>
<div id="loading_indicator" style="position: fixed; width: 100%; height: 100%; background: #164772; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div class="loader"></div>
</div>

<style>
    .loader {
        border: 8px solid #f3f3f3;
        border-top: 8px solid #F57C00;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function(ev) {
        setTimeout(function() {
            var loading = document.getElementById('loading_indicator');
            if (loading) {
                loading.style.display = 'none';
            }
        }, 500);
    });
</script>

<script src="flutter_bootstrap.js?v=1.6.4" async></script>

<script>
    // Este bloque asegura que usemos el renderizador HTML (más compatible)
    // Nota: Si usas flutter_bootstrap.js moderno, a veces esto es redundante,
    // pero si te funciona bien así, déjalo para no romper nada en el deploy.
    window.addEventListener('load', function(ev) {
        if ("_flutter" in window && "_flutter.loader" in window) {
            _flutter.loader.load({
                onEntrypointLoaded: async function(engineInitializer) {
                    const appRunner = await engineInitializer.initializeEngine({
                        renderer: "html"
                    });
                    await appRunner.runApp();
                }
            });
        }
    });
</script>
</body>
</html>
